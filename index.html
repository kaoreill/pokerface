<title>Poker Face</title>
</head>
<body>
<script>
// Every tunable number in the game lives in CONFIG.
const CONFIG = {
  levels: [
    {
      key: 'salary',
      name: 'Salary talk',
      suit: '♣',
      opponentName: 'Maya',
      personaKey: 'maya',
      terms: [
        {
          name: 'Salary',
          options: [60000, 62500, 65000, 67500, 70000, 72500, 75000, 77500, 80000, 82500, 85000, 87500, 90000],
          playerWeight: 0.70,
          opponentWeight: 0.40,
        },
        {
          name: 'Equity',
          options: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0],
          playerWeight: 0.30,
          opponentWeight: 0.60,
        },
      ],
      persona: { A0: 80, Ro: 45, c: 5, maxTurns: 8, minRel: 40, bluffDetection: 0.20, startingRel: () => 55 },
    },
    {
      key: 'cofounder',
      name: 'Co-founder split',
      suit: '♦',
      opponentName: 'Jonas',
      personaKey: 'jonas',
      terms: [
        {
          name: 'Your equity share',
          options: [70, 65, 60, 55, 50, 45, 40],
          playerWeight: 0.50,
          opponentWeight: 0.30,
        },
        {
          name: 'Final say',
          options: [
            'You decide',
            'You decide, Jonas can veto tech',
            'Joint, an advisor breaks ties',
            'Equal votes, no tie-break',
          ],
          playerWeight: 0.35,
          opponentWeight: 0.25,
        },
        {
          name: "Jonas's role",
          options: ['VP Engineering', 'CTO', 'CTO with a board seat'],
          playerWeight: 0.15,
          opponentWeight: 0.45,
        },
      ],
      persona: { A0: 85, Ro: 50, c: 4, maxTurns: 8, minRel: 60, bluffDetection: 0.50, startingRel: (rep) => 50 + 0.4 * (rep - 50) },
    },
    {
      key: 'merger',
      name: 'Merger',
      suit: '♠',
      opponentName: 'Victoria',
      personaKey: 'victoria',
      terms: [
        {
          name: 'Valuation of your company',
          options: [12, 11, 10, 9, 8],
          playerWeight: 0.30,
          opponentWeight: 0.35,
        },
        {
          name: 'Payment',
          options: ['100% cash', '75% cash', '50-50', '75% stock', '100% stock'],
          playerWeight: 0.10,
          opponentWeight: 0.25,
        },
        {
          name: 'Your role after the merger',
          options: ['CEO', 'Co-CEO', 'COO', 'Advisor for one year', 'Exit'],
          playerWeight: 0.15,
          opponentWeight: 0.25,
        },
        {
          name: 'Job guarantee for your team',
          options: [24, 18, 12, 6, 0],
          playerWeight: 0.30,
          opponentWeight: 0.05,
        },
        {
          name: 'Brand',
          options: ['Your brand stays', 'Co-branded', 'Their brand only'],
          playerWeight: 0.15,
          opponentWeight: 0.10,
        },
      ],
      persona: { A0: 90, Ro: 55, c: 4, maxTurns: 10, minRel: 45, bluffDetection: 0.70, startingRel: (rep) => 45 + 0.4 * (rep - 50) },
    },
  ],
};

function computeDV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const p = 1 - pkg[idx] / (term.options.length - 1);
    total += term.playerWeight * p;
  });
  return total * 100;
}

function computeOV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const q = pkg[idx] / (term.options.length - 1);
    total += term.opponentWeight * q;
  });
  return total * 100;
}

function enumeratePackages(levelConfig) {
  let pkgs = [[]];
  for (const term of levelConfig.terms) {
    const next = [];
    for (const prefix of pkgs) {
      for (let i = 0; i < term.options.length; i++) next.push(prefix.concat(i));
    }
    pkgs = next;
  }
  return pkgs;
}

function computeMaxLine(levelConfig) {
  const floor = levelConfig.persona.Ro - 5;
  let best = -Infinity;
  for (const pkg of enumeratePackages(levelConfig)) {
    if (computeOV(levelConfig, pkg) >= floor) best = Math.max(best, computeDV(levelConfig, pkg));
  }
  return Math.floor(Math.min(best - 5, 70));
}

function packageDistance(pkgA, pkgB) {
  let total = 0;
  for (let i = 0; i < pkgA.length; i++) total += Math.abs(pkgA[i] - pkgB[i]);
  return total;
}

function computeAcceptanceThreshold(persona, timeSteps, pressure, rel) {
  const A = Math.max(persona.Ro, persona.A0 - persona.c * timeSteps - pressure);
  const Aeff = Math.max(persona.Ro - 5, A - 0.15 * (rel - 50));
  return { A, Aeff };
}

function resolveBluffChance(persona, rep, pressureCountThisLevel) {
  const chance = persona.bluffDetection + (rep < 40 ? 0.15 : 0) + 0.20 * pressureCountThisLevel;
  return Math.max(0, Math.min(0.95, chance));
}

function pickOpponentCounter(levelConfig, playerOfferPkg, aeff, previousCounterOV) {
  let target = aeff + 3;
  if (previousCounterOV != null) target = Math.min(target, previousCounterOV);
  let best = null;
  let fallback = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    const ov = computeOV(levelConfig, pkg);
    if (fallback === null || ov > fallback.ov) fallback = { pkg, ov };
    if (ov < target) continue;
    const dist = packageDistance(pkg, playerOfferPkg);
    const dv = computeDV(levelConfig, pkg);
    if (best === null || dist < best.dist || (dist === best.dist && dv > best.dv)) best = { pkg, ov, dist, dv };
  }
  // A very low cap can leave no package at or above target; take the highest-OV package.
  const chosen = best || fallback;
  return { pkg: chosen.pkg, ov: chosen.ov };
}

// ---- end of game logic ----
if (typeof module !== 'undefined') { module.exports = { CONFIG, computeDV, computeOV, enumeratePackages, computeMaxLine, packageDistance, computeAcceptanceThreshold, resolveBluffChance, pickOpponentCounter }; }
</script>
