function computeDV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const p = 1 - pkg[idx] / (term.options.length - 1);
    total += term.playerWeight * p;
  });
  return total * 100;
}

function computeOV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const q = pkg[idx] / (term.options.length - 1);
    total += term.opponentWeight * q;
  });
  return total * 100;
}

function enumeratePackages(levelConfig) {
  let pkgs = [[]];
  for (const term of levelConfig.terms) {
    const next = [];
    for (const prefix of pkgs) {
      for (let i = 0; i < term.options.length; i++) next.push(prefix.concat(i));
    }
    pkgs = next;
  }
  return pkgs;
}

function computeMaxLine(levelConfig) {
  const floor = levelConfig.persona.Ro - 5;
  let best = -Infinity;
  for (const pkg of enumeratePackages(levelConfig)) {
    if (computeOV(levelConfig, pkg) >= floor) best = Math.max(best, computeDV(levelConfig, pkg));
  }
  return Math.floor(Math.min(best - 5, 70));
}

function packageDistance(pkgA, pkgB) {
  let total = 0;
  for (let i = 0; i < pkgA.length; i++) total += Math.abs(pkgA[i] - pkgB[i]);
  return total;
}

function computeAcceptanceThreshold(persona, timeSteps, pressure, rel) {
  const A = Math.max(persona.Ro, persona.A0 - persona.c * timeSteps - pressure);
  const Aeff = Math.max(persona.Ro - 5, A - 0.15 * (rel - 50));
  return { A, Aeff };
}

function resolveBluffChance(persona, rep, pressureCountThisLevel) {
  const chance = persona.bluffDetection + (rep < 40 ? 0.15 : 0) + 0.20 * pressureCountThisLevel;
  return Math.max(0, Math.min(0.95, chance));
}

function pickOpponentCounter(levelConfig, playerOfferPkg, aeff, previousCounterOV) {
  let target = aeff + 3;
  if (previousCounterOV != null) target = Math.min(target, previousCounterOV);
  let best = null;
  let fallback = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    const ov = computeOV(levelConfig, pkg);
    if (fallback === null || ov > fallback.ov) fallback = { pkg, ov };
    if (ov < target) continue;
    const dist = packageDistance(pkg, playerOfferPkg);
    const dv = computeDV(levelConfig, pkg);
    if (best === null || dist < best.dist || (dist === best.dist && dv > best.dv)) best = { pkg, ov, dist, dv };
  }
  // A very low cap can leave no package at or above target; take the highest-OV package.
  const chosen = best || fallback;
  return { pkg: chosen.pkg, ov: chosen.ov };
}

function classifyOfferChange(offerPkg, previousOwnOfferPkg) {
  let towardOpponent = 0;
  let towardPlayer = 0;
  for (let i = 0; i < offerPkg.length; i++) {
    if (offerPkg[i] > previousOwnOfferPkg[i]) towardOpponent++;
    else if (offerPkg[i] < previousOwnOfferPkg[i]) towardPlayer++;
  }
  return { towardOpponent, towardPlayer };
}

function isOfferLegal(offerPkg, previousOwnOfferPkg, turnNumber) {
  if (turnNumber < 2 || !previousOwnOfferPkg) return { legal: true, reason: null };
  const { towardOpponent, towardPlayer } = classifyOfferChange(offerPkg, previousOwnOfferPkg);
  if (towardPlayer >= 1 && towardOpponent === 0) {
    return { legal: false, reason: "You can't take back what you already offered." };
  }
  return { legal: true, reason: null };
}

function isLineLegal(line, moveCtx) {
  const { turnNumber, offerPkg, previousOwnOfferPkg, asksSoFar, termCount } = moveCtx;
  const no = (reason) => ({ legal: false, reason });
  const yes = { legal: true, reason: null };
  const change = () => classifyOfferChange(offerPkg, previousOwnOfferPkg);
  switch (line) {
    case 'anchor':
      return previousOwnOfferPkg == null ? yes : no('Only for your opening offer.');
    case 'askQuestion':
      return asksSoFar < termCount ? yes : no('You have already asked about every term.');
    case 'trade': {
      if (turnNumber < 2) return no('Trade needs an earlier offer to compare with.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent >= 1 && towardPlayer >= 1 ? yes : no('Move at least one term toward them and one toward you.');
    }
    case 'holdFirm': {
      if (turnNumber < 2) return no('Hold firm needs an earlier offer to hold.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent === 0 && towardPlayer === 0 ? yes : no('Your offer must match your previous offer.');
    }
    case 'concede': {
      if (turnNumber < 2) return no('Concede needs an earlier offer to move from.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent >= 1 && towardPlayer === 0 ? yes : no('Move at least one term toward them and none toward you.');
    }
    case 'pressure':
      return turnNumber >= 2 ? yes : no('Pressure only works from the second turn.');
    default:
      return no('Unknown line.');
  }
}

function applyMoveEffects(line, tone, expression, persona, moveCtx) {
  const rules = CONFIG.rules;
  const key = moveCtx.personaKey;
  let relDelta = 0;
  let pressureDelta = 0;
  let skipTimeConcession = false;
  let isBluffAttempt = false;
  let tradeBonus = 0;
  let anchorResult = null;

  if (line === 'anchor') {
    const r = rules.anchor;
    if (moveCtx.offerDV > r.strongMax) {
      relDelta += r.insultingRel;
      anchorResult = 'insulting';
    } else if (moveCtx.offerDV >= r.strongMin) {
      pressureDelta += r.strongPressure;
      relDelta += r.strongRel;
      anchorResult = 'strong';
    } else {
      anchorResult = 'weak';
    }
  } else if (line === 'askQuestion') {
    relDelta += rules.askQuestion.rel[key];
  } else if (line === 'trade') {
    relDelta += rules.trade.rel;
    tradeBonus = rules.trade.ovBonus;
  } else if (line === 'holdFirm') {
    const r = rules.holdFirm;
    pressureDelta += r.pressure;
    relDelta += r.rel[key];
    if (moveCtx.holdFirmStreak + 1 >= r.streakFrom) relDelta += r.streakRel;
  } else if (line === 'concede') {
    relDelta += rules.concede.rel;
    if (moveCtx.lastLine === 'concede') skipTimeConcession = true;
  } else if (line === 'pressure') {
    isBluffAttempt = true;
  }

  const t = rules.tones[tone];
  relDelta += t.rel[key];
  pressureDelta += t.pressure;

  if (expression === 'open') {
    const r = rules.expression.open;
    relDelta += r.rel;
    if (moveCtx.offerDV != null && moveCtx.offerDV >= moveCtx.W + r.roomMargin) skipTimeConcession = true;
  } else if (expression === 'pokerFace') {
    const r = rules.expression.pokerFace;
    if (moveCtx.pokerFaceStreak + 1 >= r.streakFrom) relDelta += r.streakRel;
  }

  return { relDelta, pressureDelta, skipTimeConcession, isBluffAttempt, tradeBonus, anchorResult };
}

function clampRel(rel) {
  return Math.max(CONFIG.rules.relMin, Math.min(CONFIG.rules.relMax, rel));
}

function createInitialHandState(levelConfig, W, rep) {
  return {
    levelConfig,
    W,
    rep,
    rel: clampRel(levelConfig.persona.startingRel(rep)),
    timeSteps: 0,
    pressure: 0,
    turnNumber: 1,
    log: [],
    revealedTerms: [],
    asksSoFar: 0,
    pressureCountThisLevel: 0,
    bluffsCaughtThisLevel: 0,
    holdFirmStreak: 0,
    pokerFaceStreak: 0,
    lastLine: null,
    previousOwnOfferPkg: null,
    opponentCounterPkg: null,
    opponentCounterOV: null,
    isFinalOffer: false,
    ended: false,
    endingType: null,
    agreedPkg: null,
  };
}

function pickOpeningPackage(levelConfig) {
  const target = levelConfig.persona.A0;
  let best = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    const ov = computeOV(levelConfig, pkg);
    const gap = Math.abs(ov - target);
    const dv = computeDV(levelConfig, pkg);
    if (best === null || gap < best.gap || (gap === best.gap && dv > best.dv)) best = { pkg, ov, gap, dv };
  }
  return { pkg: best.pkg, ov: best.ov };
}

function pickNextTermToReveal(levelConfig, revealedTerms) {
  let best = null;
  for (const term of levelConfig.terms) {
    if (revealedTerms.includes(term.name)) continue;
    if (best === null || term.opponentWeight > best.opponentWeight) best = term;
  }
  return best ? best.name : null;
}

function playTurn(handState, move, rng = Math.random) {
  const { levelConfig, W, rep } = handState;
  const { persona } = levelConfig;
  const rules = CONFIG.rules;
  const { line, tone, expression } = move;
  const isAsk = line === 'askQuestion';

  if (handState.ended) throw new Error('The hand has already ended.');
  if (handState.isFinalOffer) throw new Error('That was their final offer: accept it or walk away.');

  const offer = isAsk ? handState.previousOwnOfferPkg : move.offerPkg;
  const offerDV = offer ? computeDV(levelConfig, offer) : null;
  const ctx = {
    personaKey: levelConfig.personaKey,
    turnNumber: handState.turnNumber,
    offerPkg: offer,
    previousOwnOfferPkg: handState.previousOwnOfferPkg,
    offerDV,
    W,
    asksSoFar: handState.asksSoFar,
    termCount: levelConfig.terms.length,
    holdFirmStreak: handState.holdFirmStreak,
    pokerFaceStreak: handState.pokerFaceStreak,
    lastLine: handState.lastLine,
  };

  const lineCheck = isLineLegal(line, ctx);
  if (!lineCheck.legal) throw new Error(lineCheck.reason);
  if (!isAsk) {
    const offerCheck = isOfferLegal(offer, handState.previousOwnOfferPkg, handState.turnNumber);
    if (!offerCheck.legal) throw new Error(offerCheck.reason);
    if (offerDV + CONFIG.rules.dvEpsilon < W) throw new Error('This offer is below your line.');
  }

  const effects = applyMoveEffects(line, tone, expression, persona, ctx);
  let relDelta = effects.relDelta;
  let pressureDelta = effects.pressureDelta;
  let pressureCountThisLevel = handState.pressureCountThisLevel;
  let bluffsCaughtThisLevel = handState.bluffsCaughtThisLevel;
  let bluffCaught = false;
  if (effects.isBluffAttempt) {
    const chance = resolveBluffChance(persona, rep, pressureCountThisLevel);
    bluffCaught = rng() < chance;
    if (bluffCaught) {
      relDelta += rules.pressureLine.caughtRel;
      pressureDelta += rules.pressureLine.caughtPressure;
      bluffsCaughtThisLevel += 1;
    } else {
      pressureDelta += rules.pressureLine.success;
    }
    pressureCountThisLevel += 1;
  }

  const rel = clampRel(handState.rel + relDelta);
  const pressure = handState.pressure + pressureDelta;

  const next = {
    ...handState,
    rel,
    pressure,
    pressureCountThisLevel,
    bluffsCaughtThisLevel,
    log: handState.log.slice(),
    revealedTerms: handState.revealedTerms.slice(),
    turnNumber: handState.turnNumber + 1,
    holdFirmStreak: line === 'holdFirm' ? handState.holdFirmStreak + 1 : 0,
    pokerFaceStreak: expression === 'pokerFace' ? handState.pokerFaceStreak + 1 : 0,
    lastLine: line,
    previousOwnOfferPkg: isAsk ? handState.previousOwnOfferPkg : offer,
  };
  const entry = {
    turn: handState.turnNumber,
    line,
    tone,
    expression,
    offerPkg: offer,
    relDelta: rel - handState.rel,
    relAfter: rel,
    pressureDelta,
    bluffAttempted: effects.isBluffAttempt,
    bluffCaught,
    anchorResult: effects.anchorResult,
    tradeBonus: effects.tradeBonus,
    skipTimeConcession: effects.skipTimeConcession,
    revealedTerm: null,
    response: null,
    counterPkg: null,
  };
  const finish = (response) => {
    entry.response = response;
    next.log.push(entry);
    return next;
  };

  if (rel <= rules.walkoutRel) {
    next.ended = true;
    next.endingType = 'opponentWalk';
    return finish('walkout');
  }

  next.timeSteps = handState.timeSteps + (effects.skipTimeConcession ? 0 : 1);
  const { Aeff } = computeAcceptanceThreshold(persona, next.timeSteps, pressure, rel);

  let counter = null;
  if (isAsk) {
    const term = pickNextTermToReveal(levelConfig, next.revealedTerms);
    next.revealedTerms.push(term);
    next.asksSoFar = handState.asksSoFar + 1;
    entry.revealedTerm = term;
    if (offer === null) counter = pickOpeningPackage(levelConfig);
  }

  if (counter === null) {
    if (computeOV(levelConfig, offer) + effects.tradeBonus >= Aeff) {
      next.ended = true;
      next.endingType = 'deal';
      next.agreedPkg = offer;
      return finish('accept');
    }
    counter = pickOpponentCounter(levelConfig, offer, Aeff, handState.opponentCounterOV);
  }

  next.opponentCounterPkg = counter.pkg;
  next.opponentCounterOV = counter.ov;
  next.isFinalOffer = handState.turnNumber === persona.maxTurns;
  entry.counterPkg = counter.pkg;
  return finish('counter');
}

function determineEnding(handState, playerAction) {
  const { levelConfig, W, rel } = handState;
  const minRel = levelConfig.persona.minRel;
  const meetsLine = (dv) => dv + CONFIG.rules.dvEpsilon >= W;
  const failed = (ending, finalPkg = null, dv = null, finalRel = rel) => ({ ending, cleared: false, finalPkg, dv, rel: finalRel });

  const dealOutcome = (finalPkg) => {
    const dv = computeDV(levelConfig, finalPkg);
    const cleared = rel >= minRel;
    return { ending: cleared ? 'deal' : 'wonLostRelationship', cleared, finalPkg, dv, rel };
  };

  if (playerAction === null) {
    if (handState.endingType === 'deal') return dealOutcome(handState.agreedPkg);
    if (handState.endingType === 'opponentWalk') return failed('opponentWalk');
    throw new Error('The hand has not ended.');
  }
  if (playerAction === 'walk') return failed('walk');

  if (playerAction === 'accept' || playerAction === 'foldConfirmed') {
    const pkg = handState.opponentCounterPkg;
    if (pkg === null) throw new Error('There is no opponent offer on the table.');
    const dv = computeDV(levelConfig, pkg);
    if (playerAction === 'accept') {
      if (!meetsLine(dv)) throw new Error('Below your line — confirm the fold first.');
      return dealOutcome(pkg);
    }
    if (meetsLine(dv)) throw new Error('Folding only applies to an offer below your line.');
    const bonus = CONFIG.rules.fold.relBonus;
    const finalRel = clampRel(rel + bonus);
    const cleared = finalRel >= minRel + bonus;
    return { ending: cleared ? 'foldCleared' : 'foldFailed', cleared, finalPkg: pkg, dv, rel: finalRel };
  }
  throw new Error('Unknown player action: ' + playerAction);
}

function computeLevelScore(ending, dv, rel, W) {
  if (ending !== 'deal' && ending !== 'foldCleared') return 0;
  const s = CONFIG.rules.score;
  return s.dv * dv + s.rel * rel + (ending === 'foldCleared' ? 0 : s.line * W);
}

function updateReputation(rep, { ending, finalRel, bluffsCaughtThisLevel }) {
  const r = CONFIG.rules.reputation;
  const changes = [];
  if (ending === 'deal') {
    if (finalRel >= r.clearedHighRel) changes.push({ reason: 'Cleared with a strong relationship', delta: r.clearedHighDelta });
    else changes.push({ reason: 'Cleared the level', delta: r.clearedLowDelta });
  } else if (ending === 'foldCleared') {
    changes.push({ reason: 'Cleared by folding', delta: r.foldDelta });
  }
  if (finalRel < r.lowRelThreshold) changes.push({ reason: 'Relationship ended badly', delta: r.lowRelDelta });
  if (bluffsCaughtThisLevel > 0) {
    changes.push({
      reason: bluffsCaughtThisLevel === 1 ? 'Bluff caught' : `${bluffsCaughtThisLevel} bluffs caught`,
      delta: r.bluffCaughtDelta * bluffsCaughtThisLevel,
    });
  }
  if (ending === 'walk') {
    if (finalRel >= r.walkRelThreshold) changes.push({ reason: 'Walked away on good terms', delta: r.walkHighDelta });
    else changes.push({ reason: 'Walked away on bad terms', delta: r.walkLowDelta });
  }
  const total = changes.reduce((sum, c) => sum + c.delta, rep);
  return { rep: Math.max(0, Math.min(100, total)), changes };
}

function computeFinalScore(levelScores, rep) {
  return levelScores.reduce((sum, s) => sum + s, 0) + CONFIG.rules.score.repFinal * rep;
}

function bestAcceptableDV(handState) {
  const { levelConfig, timeSteps, pressure, rel } = handState;
  const { Aeff } = computeAcceptanceThreshold(levelConfig.persona, timeSteps, pressure, rel);
  let best = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    if (computeOV(levelConfig, pkg) < Aeff) continue;
    const dv = computeDV(levelConfig, pkg);
    if (best === null || dv > best) best = dv;
  }
  return best;
}

function selfTestLevel(levelConfig) {
  const { persona } = levelConfig;
  const packages = enumeratePackages(levelConfig);
  const checks = [];

  const playerSum = levelConfig.terms.reduce((sum, t) => sum + t.playerWeight, 0);
  const opponentSum = levelConfig.terms.reduce((sum, t) => sum + t.opponentWeight, 0);
  checks.push({
    name: 'weights sum to 1',
    pass: Math.abs(playerSum - 1) < 1e-9 && Math.abs(opponentSum - 1) < 1e-9,
    detail: `player ${playerSum}, opponent ${opponentSum}`,
  });

  const viable = packages.filter((pkg) => computeOV(levelConfig, pkg) >= persona.Ro && computeDV(levelConfig, pkg) >= 50);
  checks.push({
    name: 'a package has OV >= Ro and DV >= 50',
    pass: viable.length > 0,
    detail: `${viable.length} of ${packages.length} packages qualify (Ro ${persona.Ro})`,
  });

  const maxLine = computeMaxLine(levelConfig);
  checks.push({ name: 'maxLine >= 40', pass: maxLine >= 40, detail: `maxLine ${maxLine}` });

  let offer = null;
  let offerGap = Infinity;
  let offerDV = -Infinity;
  for (const pkg of packages) {
    const gap = Math.abs(computeOV(levelConfig, pkg) - persona.Ro);
    const dv = computeDV(levelConfig, pkg);
    if (gap < offerGap || (gap === offerGap && dv > offerDV)) {
      offer = pkg;
      offerGap = gap;
      offerDV = dv;
    }
  }
  const offerOV = computeOV(levelConfig, offer);
  const rel = persona.startingRel(CONFIG.rules.reputation.start);
  let acceptedTurn = null;
  let aeff = null;
  for (let turn = 1; turn <= persona.maxTurns; turn++) {
    aeff = computeAcceptanceThreshold(persona, turn, 0, rel).Aeff;
    if (offerOV >= aeff) { acceptedTurn = turn; break; }
  }
  checks.push({
    name: 'offer closest to OV = Ro is accepted before the turn limit',
    pass: acceptedTurn !== null,
    detail: acceptedTurn !== null
      ? `offer OV ${offerOV.toFixed(1)} (DV ${offerDV.toFixed(1)}) accepted on turn ${acceptedTurn} of ${persona.maxTurns} (Aeff ${aeff.toFixed(1)})`
      : `offer OV ${offerOV.toFixed(1)} (DV ${offerDV.toFixed(1)}) never accepted in ${persona.maxTurns} turns (final Aeff ${aeff.toFixed(1)})`,
  });

  return checks;
}

function runSelfTest(options = {}) {
  const log = options.log !== false;
  const levels = CONFIG.levels.map((levelConfig) => ({ key: levelConfig.key, checks: selfTestLevel(levelConfig) }));
  const passed = levels.every((level) => level.checks.every((c) => c.pass));
  if (log) {
    for (const level of levels) {
      for (const c of level.checks) {
        const line = `[selfTest] ${level.key}: ${c.name} - ${c.pass ? 'PASS' : 'FAIL'} (${c.detail})`;
        if (c.pass) console.log(line); else console.error(line);
      }
    }
    const summary = `[selfTest] ${passed ? 'all checks passed' : 'some checks FAILED'}`;
    if (passed) console.log(summary); else console.error(summary);
  }
  return { passed, levels };
}

function termDirections(offerPkg, previousOwnOfferPkg) {
  return offerPkg.map((choice, i) => Math.sign(choice - previousOwnOfferPkg[i]));
}

function getReactionFace(delta) {
  const r = CONFIG.rules.reactions.find((entry) => delta >= entry.min);
  return { face: r.face, caption: r.caption, bucket: r.bucket };
}

function relChangeBucket(delta) {
  return getReactionFace(delta).bucket;
}

function repBand(rep) {
  const bands = CONFIG.rules.repBands;
  if (rep >= bands.respectful) return 'respectful';
  if (rep >= bands.neutral) return 'neutral';
  return 'distrustful';
}

function getOpponentLine(context, rng = Math.random) {
  const { personaKey, relChangeBucket: bucket, special, repBand: band } = context;
  const level = CONFIG.levels.find((l) => l.personaKey === personaKey);
  if (!level) throw new Error(`No persona "${personaKey}" to speak for.`);
  const lines = level.persona.lines;
  let bank;
  let bankName;
  if (special) {
    if (special === 'opening' && personaKey === 'victoria' && band) {
      bank = lines.openingByRep && lines.openingByRep[band];
      bankName = `openingByRep.${band}`;
    } else {
      bank = lines[special];
      bankName = special;
    }
  } else {
    bank = lines[bucket];
    bankName = String(bucket);
  }
  if (!Array.isArray(bank) || bank.length === 0) {
    throw new Error(`Missing or empty dialogue bank "${bankName}" for ${personaKey}.`);
  }
  return bank[Math.floor(rng() * bank.length)];
}

function getCoachTip(context) {
  const {
    personaKey, turnNumber, line, lastLine, tone, expression, anchorResult, bluffCaught,
    skipTimeConcession, asksSoFar, relDelta, offerPkg, previousOwnOfferPkg, levelConfig,
  } = context;

  if (bluffCaught) {
    return 'They saw through the bluff. That costs you their trust right now and your reputation when the level ends, so only bluff when you can afford to be called.';
  }

  const secondConcede = line === 'concede' && lastLine === 'concede';
  if (secondConcede) return 'You gave something up and got nothing back. Try a Trade.';

  if (expression === 'open' && skipTimeConcession) return 'They could see you had room. Consider a poker face.';

  if (anchorResult === 'insulting') {
    const a = CONFIG.rules.anchor;
    return `Your anchor was too high and came across as insulting. Aim for an offer worth ${a.strongMin} to ${a.strongMax} to you.`;
  }
  if (anchorResult === 'weak') {
    return `Your anchor was too weak and gave away your best ground. Open with an offer worth at least ${CONFIG.rules.anchor.strongMin} to you.`;
  }

  const badTone = (tone === 'hard' && (personaKey === 'maya' || personaKey === 'jonas'))
    || (tone === 'warm' && personaKey === 'victoria');
  if (badTone) {
    const who = { maya: 'Maya', jonas: 'Jonas', victoria: 'Victoria' }[personaKey];
    return `A ${tone} tone doesn't land with ${who}. Try a different tone next time.`;
  }

  if (turnNumber >= 3 && asksSoFar === 0) return "You still don't know what they care about.";

  if (line === 'trade' && offerPkg && previousOwnOfferPkg && levelConfig) {
    const dirs = termDirections(offerPkg, previousOwnOfferPkg);
    const gave = dirs.indexOf(1);
    const got = dirs.indexOf(-1);
    if (gave !== -1 && got !== -1) {
      return `Good trade: you gave ground on ${levelConfig.terms[gave].name} and got ${levelConfig.terms[got].name} in return.`;
    }
  }

  if (relDelta > 0) return 'That went over well. Keep listening for what matters most to them.';
  if (relDelta < 0) return 'That cost you some goodwill. Watch how they react before your next move.';
  return "Nothing moved there. Look for a term they'd value more than you do.";
}

// ---- end of game logic ----
if (typeof module !== 'undefined') { module.exports = { CONFIG, computeDV, computeOV, enumeratePackages, computeMaxLine, packageDistance, computeAcceptanceThreshold, resolveBluffChance, pickOpponentCounter, classifyOfferChange, isOfferLegal, isLineLegal, applyMoveEffects, createInitialHandState, playTurn, determineEnding, computeLevelScore, updateReputation, computeFinalScore, bestAcceptableDV, runSelfTest, termDirections, getReactionFace, relChangeBucket, repBand, getOpponentLine, getCoachTip }; }
if (typeof window !== 'undefined') { runSelfTest(); }
</script>
