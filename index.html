<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Face</title>
<style>
:root { --felt: #0b4a2f; --card: #fbf6e6; --ink: #1d1d1f; --muted: #5d5a4c; --gold: #d4a937; --red: #b3202a; --edge: #e2d6a8; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; color: #f6f1dc; font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: radial-gradient(ellipse at 50% 25%, #17714a 0%, #0b4a2f 55%, #04190f 100%) fixed; }
#app { max-width: 1100px; margin: 0 auto; padding: 1rem; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
h1 { font-size: 1.7rem; color: var(--gold); }
h2 { font-size: 1.1rem; }
h1:focus { outline: none; }
.muted { color: var(--muted); font-size: .9rem; }
.suit { font-weight: 700; } .suit.red { color: var(--red); } .suit.blk { color: #111; }
.felt-text { color: #cfe3d4; }
:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; box-shadow: 0 0 0 2px #fff; }
.panel { position: relative; overflow: hidden; background: var(--card); color: var(--ink); border: 2px solid var(--edge);
  border-radius: 14px; padding: 1rem; margin-bottom: .8rem; box-shadow: 0 3px 10px rgba(0, 0, 0, .35); }
.panel::after { content: var(--wm, '♠'); position: absolute; right: .5rem; bottom: -.9rem; font-size: 5rem; opacity: .07; pointer-events: none; }
.panel .muted { color: var(--muted); }
.btn { font: inherit; font-weight: 700; cursor: pointer; padding: .6rem 1rem; border-radius: 10px; border: 2px solid #8a6d12;
  background: linear-gradient(#f0cd62, var(--gold)); color: #231a00; }
.btn.secondary { background: #fffdf4; border-color: #b9a96a; color: var(--ink); }
.btn.danger { background: #fbe3e1; border-color: #b3202a; color: #6b0f16; }
.btn:disabled, .tcard:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: .8rem; }
.levels { list-style: none; padding: 0; margin: .8rem 0; display: grid; gap: .6rem; }
.lvl { width: 100%; text-align: left; font-size: 1.05rem; }
.lock { font-weight: 400; font-size: .85rem; margin-left: .4rem; }
.big { font-size: 3rem; font-weight: 800; color: var(--felt); line-height: 1; }
input[type=range] { width: 100%; accent-color: var(--felt); min-height: 1.6rem; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { border-bottom: 1px solid var(--edge); padding: .3rem .4rem; text-align: left; vertical-align: top; }
.tablewrap { overflow-x: auto; }
ul.tips { padding-left: 1.2rem; margin: .3rem 0; }

.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.meter { display: flex; gap: .5rem; align-items: flex-end; padding: .6rem; margin-bottom: .6rem; }
.meter .minfo { flex: 1; min-width: 0; }
.mlabel { font-weight: 700; font-size: .85rem; }
.num { font-size: 1.5rem; }
.delta { font-weight: 700; margin-left: .3rem; }
.delta.show { animation: pop .6s ease-out; }
.delta.pos { color: #1b7f3a; } .delta.neg { color: var(--red); }
.stack { display: flex; flex-direction: column-reverse; align-items: center; width: 2.4rem; min-height: 1rem; flex: none; }
.chip { width: 2.4rem; height: .5rem; margin-top: -.06rem; border-radius: .25rem; border: 1px solid rgba(0, 0, 0, .45);
  background: repeating-linear-gradient(90deg, #f7f7f7 0 5px, var(--chip) 5px 14px); animation: chipIn .35s ease-out; }
.m-dv { --chip: #2e7d32; } .m-dv.low { --chip: #c62828; } .m-rel { --chip: #1565c0; } .m-rep { --chip: #6a1b9a; }
.bar { position: relative; height: .6rem; background: #ddd5b5; border-radius: .3rem; margin: .2rem 0; }
.fill { display: block; height: 100%; width: 0; border-radius: .3rem; background: var(--chip); transition: width .6s ease; }
.tick { position: absolute; top: -.25rem; width: 3px; height: 1.1rem; background: var(--gold); border: 1px solid #5c4600; margin-left: -1px; }
/* table layout */
.table-grid { display: grid; gap: .8rem; grid-template-columns: 1fr; align-items: start; }
.opp-head { display: flex; gap: .8rem; align-items: center; }
.face { font-size: 2.6rem; line-height: 1; }
.chat { max-height: 16rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding: .3rem; border-radius: 8px; background: rgba(0, 0, 0, .05); }
.msg { padding: .5rem .7rem; border-radius: 12px; max-width: 94%; }
.msg p { margin: .25rem 0; }
.msg.you { align-self: flex-end; background: #dcefe2; border: 1px solid #9bc9aa; }
.msg.opp { align-self: flex-start; background: #fff; border: 1px solid #d8d2b8; }
.msg.coach { align-self: stretch; max-width: 100%; background: #1f2a44; color: #e8ecff; font-style: italic; border-left: 5px solid var(--gold); }
.tag { display: inline-block; font-size: .78rem; padding: 0 .4rem; border-radius: .6rem; background: #fff3c4; border: 1px solid #d4b94f; margin-right: .2rem; }
.term { display: grid; grid-template-columns: 1fr auto; gap: .1rem .6rem; margin-bottom: .7rem; }
.term input, .term .counter { grid-column: 1 / -1; }
.term .val { font-weight: 800; color: var(--felt); }
.counter { font-size: .88rem; color: #7a4a00; }
.dv-read { font-weight: 700; } .dv-read.bad { color: var(--red); }
.cards { display: grid; gap: .5rem; grid-template-columns: 1fr; }
.tcard { font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: .15rem; padding: .55rem .7rem;
  background: #fffdf4; color: var(--ink); border: 2px solid #cdbf91; border-radius: 10px; }
.tcard[aria-pressed=true] { border-color: var(--gold); background: #fff0b8; box-shadow: inset 0 0 0 2px var(--gold); }
.tcard:disabled { background: #e6e2d2; color: #6c6858; }
.cname { font-weight: 800; } .csay { font-size: .9rem; } .reason { font-size: .82rem; color: var(--red); font-weight: 600; }
.group { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
.tog { font: inherit; cursor: pointer; padding: .4rem .7rem; border-radius: 999px; border: 2px solid #b9a96a; background: #fffdf4; color: var(--ink); }
.tog[aria-pressed=true] { background: var(--felt); color: #fff; border-color: #052a1a; }
.banner { background: #fff0b8; border: 2px solid var(--gold); border-radius: 10px; padding: .6rem .8rem; font-weight: 800; margin-bottom: .6rem; }
dialog { border: 3px solid var(--gold); border-radius: 14px; background: var(--card); color: var(--ink); max-width: 24rem; padding: 1.2rem; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }
@keyframes chipIn { from { transform: translateY(-.8rem); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 700px) {
  .table-grid { grid-template-columns: 1fr 1fr; }
  .col-ctl { grid-column: 1; grid-row: 1; } .col-opp { grid-column: 2; grid-row: 1; position: sticky; top: .5rem; }
  .chat { max-height: 26rem; } .cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) { .meter { flex-direction: column; align-items: stretch; } .stack { align-self: center; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

    tones: {
      warm: { rel: { maya: 3, jonas: 2, victoria: -1 }, pressure: 0 },
      neutral: { rel: { maya: 1, jonas: 0, victoria: 0 }, pressure: 0 },
      firm: { rel: { maya: -1, jonas: -3, victoria: 2 }, pressure: 1 },
      hard: { rel: { maya: -6, jonas: -8, victoria: -4 }, pressure: 3 },
    },
    expression: {
      open: { rel: 1, roomMargin: 15 },
      pokerFace: { streakFrom: 4, streakRel: -2 },
    },
  },
};

function computeDV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const p = 1 - pkg[idx] / (term.options.length - 1);
    total += term.playerWeight * p;
  });
  return total * 100;
}

function computeOV(levelConfig, pkg) {
  let total = 0;
  levelConfig.terms.forEach((term, idx) => {
    const q = pkg[idx] / (term.options.length - 1);
    total += term.opponentWeight * q;
  });
  return total * 100;
}

function enumeratePackages(levelConfig) {
  let pkgs = [[]];
  for (const term of levelConfig.terms) {
    const next = [];
    for (const prefix of pkgs) {
      for (let i = 0; i < term.options.length; i++) next.push(prefix.concat(i));
    }
    pkgs = next;
  }
  return pkgs;
}

function computeMaxLine(levelConfig) {
  const rules = CONFIG.rules;
  const floor = levelConfig.persona.Ro - rules.opponent.floorMargin;
  let best = -Infinity;
  for (const pkg of enumeratePackages(levelConfig)) {
    if (computeOV(levelConfig, pkg) >= floor) best = Math.max(best, computeDV(levelConfig, pkg));
  }
  return Math.floor(Math.min(best - rules.maxLine.margin, rules.maxLine.cap));
}

function packageDistance(pkgA, pkgB) {
  let total = 0;
  for (let i = 0; i < pkgA.length; i++) total += Math.abs(pkgA[i] - pkgB[i]);
  return total;
}

function computeAcceptanceThreshold(persona, timeSteps, pressure, rel) {
  const A = Math.max(persona.Ro, persona.A0 - persona.c * timeSteps - pressure);
  const o = CONFIG.rules.opponent;
  const Aeff = Math.max(persona.Ro - o.floorMargin, A - o.relCoeff * (rel - o.relMidpoint));
  return { A, Aeff };
}

function resolveBluffChance(persona, rep, pressureCountThisLevel) {
  const b = CONFIG.rules.bluff;
  const chance = persona.bluffDetection + (rep < b.lowRepBelow ? b.lowRepBonus : 0) + b.perPressure * pressureCountThisLevel;
  return Math.max(0, Math.min(b.cap, chance));
}

function pickOpponentCounter(levelConfig, playerOfferPkg, aeff, previousCounterOV) {
  let target = aeff + CONFIG.rules.opponent.counterMargin;
  if (previousCounterOV != null) target = Math.min(target, previousCounterOV);
  let best = null;
  let fallback = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    const ov = computeOV(levelConfig, pkg);
    if (fallback === null || ov > fallback.ov) fallback = { pkg, ov };
    if (ov < target) continue;
    const dist = packageDistance(pkg, playerOfferPkg);
    const dv = computeDV(levelConfig, pkg);
    if (best === null || dist < best.dist || (dist === best.dist && dv > best.dv)) best = { pkg, ov, dist, dv };
  }
  // A very low cap can leave no package at or above target; take the highest-OV package.
  const chosen = best || fallback;
  return { pkg: chosen.pkg, ov: chosen.ov };
}

function classifyOfferChange(offerPkg, previousOwnOfferPkg) {
  let towardOpponent = 0;
  let towardPlayer = 0;
  for (let i = 0; i < offerPkg.length; i++) {
    if (offerPkg[i] > previousOwnOfferPkg[i]) towardOpponent++;
    else if (offerPkg[i] < previousOwnOfferPkg[i]) towardPlayer++;
  }
  return { towardOpponent, towardPlayer };
}

function isOfferLegal(offerPkg, previousOwnOfferPkg, turnNumber) {
  if (turnNumber < CONFIG.rules.openingTurn || !previousOwnOfferPkg) return { legal: true, reason: null };
  const { towardOpponent, towardPlayer } = classifyOfferChange(offerPkg, previousOwnOfferPkg);
  if (towardPlayer >= 1 && towardOpponent === 0) {
    return { legal: false, reason: "You can't take back what you already offered." };
  }
  return { legal: true, reason: null };
}

function isLineLegal(line, moveCtx) {
  const { turnNumber, offerPkg, previousOwnOfferPkg, asksSoFar, termCount } = moveCtx;
  const no = (reason) => ({ legal: false, reason });
  const yes = { legal: true, reason: null };
  const change = () => classifyOfferChange(offerPkg, previousOwnOfferPkg);
  switch (line) {
    case 'anchor':
      return previousOwnOfferPkg == null ? yes : no('Only for your opening offer.');
    case 'askQuestion':
      return asksSoFar < termCount ? yes : no('You have already asked about every term.');
    case 'trade': {
      if (turnNumber < CONFIG.rules.openingTurn) return no('Trade needs an earlier offer to compare with.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent >= 1 && towardPlayer >= 1 ? yes : no('Move at least one term toward them and one toward you.');
    }
    case 'holdFirm': {
      if (turnNumber < CONFIG.rules.openingTurn) return no('Hold firm needs an earlier offer to hold.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent === 0 && towardPlayer === 0 ? yes : no('Your offer must match your previous offer.');
    }
    case 'concede': {
      if (turnNumber < CONFIG.rules.openingTurn) return no('Concede needs an earlier offer to move from.');
      if (!previousOwnOfferPkg) return no('Make an opening offer first.');
      const { towardOpponent, towardPlayer } = change();
      return towardOpponent >= 1 && towardPlayer === 0 ? yes : no('Move at least one term toward them and none toward you.');
    }
    case 'pressure':
      return turnNumber >= CONFIG.rules.openingTurn ? yes : no('Pressure only works from the second turn.');
    default:
      return no('Unknown line.');
  }
}

function applyMoveEffects(line, tone, expression, persona, moveCtx) {
  const rules = CONFIG.rules;
  const key = moveCtx.personaKey;
  let relDelta = 0;
  let pressureDelta = 0;
  let skipTimeConcession = false;
  let isBluffAttempt = false;
  let tradeBonus = 0;
  let anchorResult = null;

  if (line === 'anchor') {
    const r = rules.anchor;
    const eps = rules.dvEpsilon;
    if (moveCtx.offerDV > r.strongMax + eps) {
      relDelta += r.insultingRel;
      anchorResult = 'insulting';
    } else if (moveCtx.offerDV + eps >= r.strongMin) {
      pressureDelta += r.strongPressure;
      relDelta += r.strongRel;
      anchorResult = 'strong';
    } else {
      anchorResult = 'weak';
    }
  } else if (line === 'askQuestion') {
    relDelta += rules.askQuestion.rel[key];
  } else if (line === 'trade') {
    relDelta += rules.trade.rel;
    tradeBonus = rules.trade.ovBonus;
  } else if (line === 'holdFirm') {
    const r = rules.holdFirm;
    pressureDelta += r.pressure;
    relDelta += r.rel[key];
    if (moveCtx.holdFirmStreak + 1 >= r.streakFrom) relDelta += r.streakRel;
  } else if (line === 'concede') {
    relDelta += rules.concede.rel;
    if (moveCtx.lastLine === 'concede') skipTimeConcession = true;
  } else if (line === 'pressure') {
    isBluffAttempt = true;
  }

  const t = rules.tones[tone];
  relDelta += t.rel[key];
  pressureDelta += t.pressure;

  if (expression === 'open') {
    const r = rules.expression.open;
    relDelta += r.rel;
    if (moveCtx.offerDV != null && moveCtx.offerDV + rules.dvEpsilon >= moveCtx.W + r.roomMargin) skipTimeConcession = true;
  } else if (expression === 'pokerFace') {
    const r = rules.expression.pokerFace;
    if (moveCtx.pokerFaceStreak + 1 >= r.streakFrom) relDelta += r.streakRel;
  }

  return { relDelta, pressureDelta, skipTimeConcession, isBluffAttempt, tradeBonus, anchorResult };
}

function clampRel(rel) {
  return Math.max(CONFIG.rules.relMin, Math.min(CONFIG.rules.relMax, rel));
}

function createInitialHandState(levelConfig, W, rep) {
  return {
    levelConfig,
    W,
    rep,
    rel: clampRel(levelConfig.persona.startingRel(rep)),
    timeSteps: 0,
    pressure: 0,
    turnNumber: 1,
    log: [],
    revealedTerms: [],
    asksSoFar: 0,
    pressureCountThisLevel: 0,
    bluffsCaughtThisLevel: 0,
    holdFirmStreak: 0,
    pokerFaceStreak: 0,
    lastLine: null,
    previousOwnOfferPkg: null,
    opponentCounterPkg: null,
    opponentCounterOV: null,
    isFinalOffer: false,
    ended: false,
    endingType: null,
    agreedPkg: null,
  };
}

function pickOpeningPackage(levelConfig) {
  const target = levelConfig.persona.A0;
  let best = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    const ov = computeOV(levelConfig, pkg);
    const gap = Math.abs(ov - target);
    const dv = computeDV(levelConfig, pkg);
    if (best === null || gap < best.gap || (gap === best.gap && dv > best.dv)) best = { pkg, ov, gap, dv };
  }
  return { pkg: best.pkg, ov: best.ov };
}

function pickNextTermToReveal(levelConfig, revealedTerms) {
  let best = null;
  for (const term of levelConfig.terms) {
    if (revealedTerms.includes(term.name)) continue;
    if (best === null || term.opponentWeight > best.opponentWeight) best = term;
  }
  return best ? best.name : null;
}

function playTurn(handState, move, rng = Math.random) {
  const { levelConfig, W, rep } = handState;
  const { persona } = levelConfig;
  const rules = CONFIG.rules;
  const { line, tone, expression } = move;
  const isAsk = line === 'askQuestion';

  if (handState.ended) throw new Error('The hand has already ended.');
  if (handState.isFinalOffer) throw new Error('That was their final offer: accept it or walk away.');

  const offer = isAsk ? handState.previousOwnOfferPkg : move.offerPkg;
  const offerDV = offer ? computeDV(levelConfig, offer) : null;
  const ctx = {
    personaKey: levelConfig.personaKey,
    turnNumber: handState.turnNumber,
    offerPkg: offer,
    previousOwnOfferPkg: handState.previousOwnOfferPkg,
    offerDV,
    W,
    asksSoFar: handState.asksSoFar,
    termCount: levelConfig.terms.length,
    holdFirmStreak: handState.holdFirmStreak,
    pokerFaceStreak: handState.pokerFaceStreak,
    lastLine: handState.lastLine,
  };

  const lineCheck = isLineLegal(line, ctx);
  if (!lineCheck.legal) throw new Error(lineCheck.reason);
  if (!isAsk) {
    const offerCheck = isOfferLegal(offer, handState.previousOwnOfferPkg, handState.turnNumber);
    if (!offerCheck.legal) throw new Error(offerCheck.reason);
    if (offerDV + CONFIG.rules.dvEpsilon < W) throw new Error('This offer is below your line.');
  }

  const effects = applyMoveEffects(line, tone, expression, persona, ctx);
  let relDelta = effects.relDelta;
  let pressureDelta = effects.pressureDelta;
  let pressureCountThisLevel = handState.pressureCountThisLevel;
  let bluffsCaughtThisLevel = handState.bluffsCaughtThisLevel;
  let bluffCaught = false;
  if (effects.isBluffAttempt) {
    const chance = resolveBluffChance(persona, rep, pressureCountThisLevel);
    bluffCaught = rng() < chance;
    if (bluffCaught) {
      relDelta += rules.pressureLine.caughtRel;
      pressureDelta += rules.pressureLine.caughtPressure;
      bluffsCaughtThisLevel += 1;
    } else {
      pressureDelta += rules.pressureLine.success;
    }
    pressureCountThisLevel += 1;
  }

  const rel = clampRel(handState.rel + relDelta);
  const pressure = handState.pressure + pressureDelta;

  const next = {
    ...handState,
    rel,
    pressure,
    pressureCountThisLevel,
    bluffsCaughtThisLevel,
    log: handState.log.slice(),
    revealedTerms: handState.revealedTerms.slice(),
    turnNumber: handState.turnNumber + 1,
    holdFirmStreak: line === 'holdFirm' ? handState.holdFirmStreak + 1 : 0,
    pokerFaceStreak: expression === 'pokerFace' ? handState.pokerFaceStreak + 1 : 0,
    lastLine: line,
    previousOwnOfferPkg: isAsk ? handState.previousOwnOfferPkg : offer,
  };
  const entry = {
    turn: handState.turnNumber,
    line,
    tone,
    expression,
    offerPkg: offer,
    relDelta: rel - handState.rel,
    relAfter: rel,
    pressureDelta,
    bluffAttempted: effects.isBluffAttempt,
    bluffCaught,
    anchorResult: effects.anchorResult,
    tradeBonus: effects.tradeBonus,
    skipTimeConcession: effects.skipTimeConcession,
    revealedTerm: null,
    response: null,
    counterPkg: null,
  };
  const finish = (response) => {
    entry.response = response;
    next.log.push(entry);
    return next;
  };

  if (rel <= rules.walkoutRel) {
    next.ended = true;
    next.endingType = 'opponentWalk';
    return finish('walkout');
  }

  next.timeSteps = handState.timeSteps + (effects.skipTimeConcession ? 0 : 1);
  const { Aeff } = computeAcceptanceThreshold(persona, next.timeSteps, pressure, rel);

  let counter = null;
  if (isAsk) {
    const term = pickNextTermToReveal(levelConfig, next.revealedTerms);
    next.revealedTerms.push(term);
    next.asksSoFar = handState.asksSoFar + 1;
    entry.revealedTerm = term;
    if (offer === null) counter = pickOpeningPackage(levelConfig);
  }

  if (counter === null) {
    if (computeOV(levelConfig, offer) + effects.tradeBonus >= Aeff) {
      next.ended = true;
      next.endingType = 'deal';
      next.agreedPkg = offer;
      return finish('accept');
    }
    counter = pickOpponentCounter(levelConfig, offer, Aeff, handState.opponentCounterOV);
  }

  next.opponentCounterPkg = counter.pkg;
  next.opponentCounterOV = counter.ov;
  next.isFinalOffer = handState.turnNumber === persona.maxTurns;
  entry.counterPkg = counter.pkg;
  return finish('counter');
}

function determineEnding(handState, playerAction) {
  const { levelConfig, W, rel } = handState;
  const minRel = levelConfig.persona.minRel;
  const meetsLine = (dv) => dv + CONFIG.rules.dvEpsilon >= W;
  const failed = (ending, finalPkg = null, dv = null, finalRel = rel) => ({ ending, cleared: false, finalPkg, dv, rel: finalRel });

  const dealOutcome = (finalPkg) => {
    const dv = computeDV(levelConfig, finalPkg);
    const cleared = rel >= minRel;
    return { ending: cleared ? 'deal' : 'wonLostRelationship', cleared, finalPkg, dv, rel };
  };

  if (playerAction === null) {
    if (handState.endingType === 'deal') return dealOutcome(handState.agreedPkg);
    if (handState.endingType === 'opponentWalk') return failed('opponentWalk');
    throw new Error('The hand has not ended.');
  }
  if (playerAction === 'walk') return failed('walk');

  if (playerAction === 'accept' || playerAction === 'foldConfirmed') {
    const pkg = handState.opponentCounterPkg;
    if (pkg === null) throw new Error('There is no opponent offer on the table.');
    const dv = computeDV(levelConfig, pkg);
    if (playerAction === 'accept') {
      if (!meetsLine(dv)) throw new Error('Below your line — confirm the fold first.');
      return dealOutcome(pkg);
    }
    if (meetsLine(dv)) throw new Error('Folding only applies to an offer below your line.');
    const bonus = CONFIG.rules.fold.relBonus;
    const finalRel = clampRel(rel + bonus);
    const cleared = finalRel >= minRel + bonus;
    return { ending: cleared ? 'foldCleared' : 'foldFailed', cleared, finalPkg: pkg, dv, rel: finalRel };
  }
  throw new Error('Unknown player action: ' + playerAction);
}

function computeLevelScore(ending, dv, rel, W) {
  if (ending !== 'deal' && ending !== 'foldCleared') return 0;
  const s = CONFIG.rules.score;
  return s.dv * dv + s.rel * rel + (ending === 'foldCleared' ? 0 : s.line * W);
}

function updateReputation(rep, { ending, finalRel, bluffsCaughtThisLevel }) {
  const r = CONFIG.rules.reputation;
  const { repMin, repMax } = CONFIG.rules;
  const changes = [];
  if (ending === 'deal') {
    if (finalRel >= r.clearedHighRel) changes.push({ reason: 'Cleared with a strong relationship', delta: r.clearedHighDelta });
    else changes.push({ reason: 'Cleared the level', delta: r.clearedLowDelta });
  } else if (ending === 'foldCleared') {
    changes.push({ reason: 'Cleared by folding', delta: r.foldDelta });
  }
  if (finalRel < r.lowRelThreshold) changes.push({ reason: 'Relationship ended badly', delta: r.lowRelDelta });
  if (bluffsCaughtThisLevel > 0) {
    changes.push({
      reason: bluffsCaughtThisLevel === 1 ? 'Bluff caught' : `${bluffsCaughtThisLevel} bluffs caught`,
      delta: r.bluffCaughtDelta * bluffsCaughtThisLevel,
    });
  }
  if (ending === 'walk') {
    if (finalRel >= r.walkRelThreshold) changes.push({ reason: 'Walked away on good terms', delta: r.walkHighDelta });
    else changes.push({ reason: 'Walked away on bad terms', delta: r.walkLowDelta });
  }
  const total = changes.reduce((sum, c) => sum + c.delta, rep);
  return { rep: Math.max(repMin, Math.min(repMax, total)), changes };
}

function computeFinalScore(levelScores, rep) {
  return levelScores.reduce((sum, s) => sum + s, 0) + CONFIG.rules.score.repFinal * rep;
}

function bestAcceptableDV(handState) {
  const { levelConfig, timeSteps, pressure, rel } = handState;
  const { Aeff } = computeAcceptanceThreshold(levelConfig.persona, timeSteps, pressure, rel);
  let best = null;
  for (const pkg of enumeratePackages(levelConfig)) {
    if (computeOV(levelConfig, pkg) < Aeff) continue;
    const dv = computeDV(levelConfig, pkg);
    if (best === null || dv > best) best = dv;
  }
  return best;
}

function selfTestLevel(levelConfig) {
  const { persona } = levelConfig;
  const packages = enumeratePackages(levelConfig);
  const checks = [];

  const playerSum = levelConfig.terms.reduce((sum, t) => sum + t.playerWeight, 0);
  const opponentSum = levelConfig.terms.reduce((sum, t) => sum + t.opponentWeight, 0);
  checks.push({
    name: 'weights sum to 1',
    pass: Math.abs(playerSum - 1) < 1e-9 && Math.abs(opponentSum - 1) < 1e-9,
    detail: `player ${playerSum}, opponent ${opponentSum}`,
  });

  const viable = packages.filter((pkg) => computeOV(levelConfig, pkg) >= persona.Ro && computeDV(levelConfig, pkg) >= CONFIG.rules.selfTest.minDV);
  checks.push({
    name: `a package has OV >= Ro and DV >= ${CONFIG.rules.selfTest.minDV}`,
    pass: viable.length > 0,
    detail: `${viable.length} of ${packages.length} packages qualify (Ro ${persona.Ro})`,
  });

  const maxLine = computeMaxLine(levelConfig);
  checks.push({ name: `maxLine >= ${CONFIG.rules.selfTest.minMaxLine}`, pass: maxLine >= CONFIG.rules.selfTest.minMaxLine, detail: `maxLine ${maxLine}` });

  let offer = null;
  let offerGap = Infinity;
  let offerDV = -Infinity;
  for (const pkg of packages) {
    const gap = Math.abs(computeOV(levelConfig, pkg) - persona.Ro);
    const dv = computeDV(levelConfig, pkg);
    if (gap < offerGap || (gap === offerGap && dv > offerDV)) {
      offer = pkg;
      offerGap = gap;
      offerDV = dv;
    }
  }
  const offerOV = computeOV(levelConfig, offer);
  const rel = persona.startingRel(CONFIG.rules.reputation.start);
  let acceptedTurn = null;
  let aeff = null;
  for (let turn = 1; turn <= persona.maxTurns; turn++) {
    aeff = computeAcceptanceThreshold(persona, turn, 0, rel).Aeff;
    if (offerOV >= aeff) { acceptedTurn = turn; break; }
  }
  checks.push({
    name: 'offer closest to OV = Ro is accepted before the turn limit',
    pass: acceptedTurn !== null,
    detail: acceptedTurn !== null
      ? `offer OV ${offerOV.toFixed(1)} (DV ${offerDV.toFixed(1)}) accepted on turn ${acceptedTurn} of ${persona.maxTurns} (Aeff ${aeff.toFixed(1)})`
      : `offer OV ${offerOV.toFixed(1)} (DV ${offerDV.toFixed(1)}) never accepted in ${persona.maxTurns} turns (final Aeff ${aeff.toFixed(1)})`,
  });

  return checks;
}

function runSelfTest(options = {}) {
  const log = options.log !== false;
  const levels = CONFIG.levels.map((levelConfig) => ({ key: levelConfig.key, checks: selfTestLevel(levelConfig) }));
  const passed = levels.every((level) => level.checks.every((c) => c.pass));
  if (log) {
    for (const level of levels) {
      for (const c of level.checks) {
        const line = `[selfTest] ${level.key}: ${c.name} - ${c.pass ? 'PASS' : 'FAIL'} (${c.detail})`;
        if (c.pass) console.log(line); else console.error(line);
      }
    }
    const summary = `[selfTest] ${passed ? 'all checks passed' : 'some checks FAILED'}`;
    if (passed) console.log(summary); else console.error(summary);
  }
  return { passed, levels };
}

function termDirections(offerPkg, previousOwnOfferPkg) {
  return offerPkg.map((choice, i) => Math.sign(choice - previousOwnOfferPkg[i]));
}

function getReactionFace(delta) {
  const r = CONFIG.rules.reactions.find((entry) => delta >= entry.min);
  return { face: r.face, caption: r.caption, bucket: r.bucket };
}

function relChangeBucket(delta) {
  return getReactionFace(delta).bucket;
}

function repBand(rep) {
  const bands = CONFIG.rules.repBands;
  if (rep >= bands.respectful) return 'respectful';
  if (rep >= bands.neutral) return 'neutral';
  return 'distrustful';
}

function getOpponentLine(context, rng = Math.random) {
  const { personaKey, relChangeBucket: bucket, special, repBand: band } = context;
  const level = CONFIG.levels.find((l) => l.personaKey === personaKey);
  if (!level) throw new Error(`No persona "${personaKey}" to speak for.`);
  const lines = level.persona.lines;
  let bank;
  let bankName;
  if (special) {
    if (special === 'opening' && personaKey === 'victoria' && band) {
      bank = lines.openingByRep && lines.openingByRep[band];
      bankName = `openingByRep.${band}`;
    } else {
      bank = lines[special];
      bankName = special;
    }
  } else {
    bank = lines[bucket];
    bankName = String(bucket);
  }
  if (!Array.isArray(bank) || bank.length === 0) {
    throw new Error(`Missing or empty dialogue bank "${bankName}" for ${personaKey}.`);
  }
  return bank[Math.floor(rng() * bank.length)];
}

function getCoachTip(context) {
  if (context.phase === 'debrief') {
    // End-of-level tips from hand statistics: the first matching rules win, at most CONFIG.ui.maxTips of them.
    const st = context.stats;
    const candidates = [
      [st.concedes >= CONFIG.ui.concedeTipMin && st.trades === 0, `You made ${st.concedes} concessions and never traded. Next time, ask for something back whenever you give something up.`],
      [st.asks === 0, 'You never asked a question, so you played blind. One early question shows which term they care about most.'],
      [st.bluffsCaught > 0, 'A caught bluff costs trust now and reputation later. Bluff rarely, and not against someone who reads you well.'],
      [st.holdFirmTurns >= CONFIG.ui.holdFirmTipMin, `You held firm on ${st.holdFirmTurns} turns. That builds pressure but wears down the relationship, so mix in a Trade.`],
      [st.trades >= 1, `You made ${st.trades} trade${st.trades === 1 ? '' : 's'}. Giving what you value less for what you value more is the heart of the game.`],
      [true, 'Look for terms where your weights differ from theirs. That is where both sides can gain.'],
      [true, 'Check the relationship meter after every move. A good deal on paper still fails if the relationship drops too far.'],
    ];
    return candidates.filter((c) => c[0]).slice(0, CONFIG.ui.maxTips).map((c) => c[1]);
  }
  const {
    personaKey, turnNumber, line, lastLine, tone, expression, anchorResult, bluffCaught,
    skipTimeConcession, asksSoFar, relDelta, offerPkg, previousOwnOfferPkg, levelConfig,
  } = context;

  if (bluffCaught) {
    return 'They saw through the bluff. That costs you their trust right now and your reputation when the level ends, so only bluff when you can afford to be called.';
  }

  const secondConcede = line === 'concede' && lastLine === 'concede';
  if (secondConcede) return 'You gave something up and got nothing back. Try a Trade.';

  if (expression === 'open' && skipTimeConcession) return 'They could see you had room. Consider a poker face.';

  if (anchorResult === 'insulting') {
    const a = CONFIG.rules.anchor;
    return `Your anchor was too high and came across as insulting. Aim for an offer worth ${a.strongMin} to ${a.strongMax} to you.`;
  }
  if (anchorResult === 'weak') {
    return `Your anchor was too weak and gave away your best ground. Open with an offer worth at least ${CONFIG.rules.anchor.strongMin} to you.`;
  }

  const badTone = (tone === 'hard' && (personaKey === 'maya' || personaKey === 'jonas'))
    || (tone === 'warm' && personaKey === 'victoria');
  if (badTone) {
    const who = { maya: 'Maya', jonas: 'Jonas', victoria: 'Victoria' }[personaKey];
    return `A ${tone} tone doesn't land with ${who}. Try a different tone next time.`;
  }

  if (turnNumber >= 3 && asksSoFar === 0) return "You still don't know what they care about.";

  if (line === 'trade' && offerPkg && previousOwnOfferPkg && levelConfig) {
    const dirs = termDirections(offerPkg, previousOwnOfferPkg);
    const gave = dirs.indexOf(1);
    const got = dirs.indexOf(-1);
    if (gave !== -1 && got !== -1) {
      return `Good trade: you gave ground on ${levelConfig.terms[gave].name} and got ${levelConfig.terms[got].name} in return.`;
    }
  }

  if (relDelta > 0) return 'That went over well. Keep listening for what matters most to them.';
  if (relDelta < 0) return 'That cost you some goodwill. Watch how they react before your next move.';
  return "Nothing moved there. Look for a term they'd value more than you do.";
}

// Rep is derived, never accumulated: start value plus the latest attempt's change for each earlier level.
function repChain(upTo) {
  const r = CONFIG.rules;
  let rep = r.reputation.start;
  for (let j = 0; j < upTo; j++) {
    if (game.repDelta[j] != null) rep = Math.max(r.repMin, Math.min(r.repMax, rep + game.repDelta[j]));
  }
  return rep;
}
function repAtStart(i) { return repChain(i); }
function currentRep() { return repChain(CONFIG.levels.length); }

// ---- small helpers ----
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtNum(n) { return String(Math.round(n * 10) / 10); }
function fmtDelta(n) { const v = Math.round(n * 10) / 10; return v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0'; }
function suitHTML(s) { return `<span class="suit ${s === '♥' || s === '♦' ? 'red' : 'blk'}" aria-hidden="true">${s}</span>`; }
function curLevel() { return CONFIG.levels[game.levelIndex]; }
function readHighScore() {
  try {
    const n = parseInt(localStorage.getItem(CONFIG.ui.highScoreKey), 10);
    return Number.isFinite(n) ? n : null;
  } catch (e) { return null; }
}
function writeHighScore(n) {
  try { localStorage.setItem(CONFIG.ui.highScoreKey, String(n)); } catch (e) { /* storage unavailable: ignore */ }
}
function trimNum(x) { return String(Math.round(x * 100) / 100); }

function formatOption(level, termIndex, optionIndex) {
  const term = level.terms[termIndex];
  const v = term.options[optionIndex];
  switch (term.format) {
    case 'thousands': return '€' + trimNum(v / 1000) + 'k';
    case 'millions': return '€' + trimNum(v) + 'M';
    case 'percent': return trimNum(v) + ' %';
    case 'months': return trimNum(v) + ' months';
    default: return String(v);
  }
}
function describePackage(level, pkg) {
  if (!pkg) return 'no offer yet';
  return pkg.map((o, i) => `${level.terms[i].name} ${formatOption(level, i, o)}`).join(' · ');
}

function oppMsgHTML(face, lines, extra) {

  return `<div><span class="face" style="font-size:1.6rem" aria-hidden="true">${face.face}</span> <strong>${esc(lv.opponentName)}</strong> <span class="muted">${esc(face.caption)}</span></div>${spoken}${extra || ''}`;
}

function paintMeter(id, value, mark) {
  const m = $('#' + id);
  if (!m) return;
  const stack = $('.stack', m);
  const want = Math.min(CONFIG.ui.maxChips, Math.max(0, Math.ceil(value / CONFIG.ui.chipValue - 1e-9)));
  while (stack.children.length < want) { const c = document.createElement('span'); c.className = 'chip'; stack.appendChild(c); }
  while (stack.children.length > want) stack.removeChild(stack.lastChild);
  $('.num', m).textContent = fmtNum(value);
  $('.fill', m).style.width = Math.max(0, Math.min(100, value)) + '%';
  const tick = $('.tick', m);
  if (mark) { tick.hidden = false; tick.style.left = mark.at + '%'; $('.mark', m).textContent = mark.text; }
}
function showRelDelta(delta) {
  const el = $('#m-rel .delta');
  if (!el) return;
  el.textContent = `(${fmtDelta(delta)})`;
  el.className = 'delta ' + (delta > 0 ? 'pos' : delta < 0 ? 'neg' : '');
  void el.offsetWidth;
  el.classList.add('show');
}
function setPressed(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

// Re-evaluate everything that depends on the draft and the hand, without touching the chat log.
function updateTableControls() {
  const lv = curLevel();
  const hand = game.hand;
  const d = game.draft;
  const final = hand.isFinalOffer;
  const prev = hand.previousOwnOfferPkg;
  const eps = CONFIG.rules.dvEpsilon;

  const ctx = {
    personaKey: lv.personaKey, turnNumber: hand.turnNumber, offerPkg: d.offer, previousOwnOfferPkg: prev,
    offerDV: computeDV(lv, d.offer), W: game.W, asksSoFar: hand.asksSoFar, termCount: lv.terms.length,
    holdFirmStreak: hand.holdFirmStreak, pokerFaceStreak: hand.pokerFaceStreak, lastLine: hand.lastLine,
  };
  // Cards: legality is judged on the draft offer; drop a selection that has become illegal.
  const legal = {};
  LINE_ORDER.forEach((k) => { legal[k] = isLineLegal(k, ctx); });
  if (d.line && !legal[d.line].legal) d.line = null;
  $$('.tcard').forEach((b) => {
    const k = b.dataset.key;
    b.disabled = !legal[k].legal;
    setPressed(b, d.line === k);
    $('#r-' + k).textContent = legal[k].legal ? '' : legal[k].reason;
  });
  $$('[data-act=tone]').forEach((b) => setPressed(b, d.tone === b.dataset.key));
  $$('[data-act=expr]').forEach((b) => setPressed(b, d.expression === b.dataset.key));
  const rules = CONFIG.rules;
  const pfRule = rules.expression.pokerFace;
  const hfRule = rules.holdFirm;
  const exprHint = $('#expr-hint');
  exprHint.hidden = hand.pokerFaceStreak < pfRule.streakFrom - 1;
  exprHint.textContent = exprHint.hidden ? '' : UI_TEXT.hints.pokerFace(hand.pokerFaceStreak, pfRule.streakRel);
  const holdHint = $('#hold-hint');
  holdHint.hidden = hand.holdFirmStreak < hfRule.streakFrom - 1;
  holdHint.textContent = holdHint.hidden ? '' : UI_TEXT.hints.holdFirm(hand.holdFirmStreak, hfRule.streakRel);

  // Offer builder: locked to the previous offer while asking, hidden if there is none.
  const asking = d.line === 'askQuestion';
  const shown = asking && prev ? prev : d.offer;
  $('#sliders').hidden = asking && !prev;
  $('#ask-note').hidden = !(asking && !prev);
  lv.terms.forEach((t, i) => {
    const input = $('#s' + i);
    input.value = shown[i];
    input.disabled = asking;
    const text = formatOption(lv, i, shown[i]);
    $('#v' + i).textContent = text;
    input.setAttribute('aria-valuetext', text);
    const c = hand.opponentCounterPkg;
    $('#c' + i).textContent = 'Their offer: ' + (c ? formatOption(lv, i, c[i]) : '—');
  });
  $('#builder').hidden = final;
  $('#moves').hidden = final;
  $('#final-banner').hidden = !final;
  $('#play').hidden = final;

  // DV readout and meter.
  const dvPkg = final && hand.opponentCounterPkg ? hand.opponentCounterPkg : shown;
  const dv = computeDV(lv, dvPkg);
  const below = dv + eps < game.W;
  const hiddenDraft = asking && !prev;
  $('#dv-read').hidden = hiddenDraft;
  $('#dv-read').textContent = `This offer is worth ${fmtNum(dv)} to you (your line: ${game.W}).`;
  $('#dv-read').classList.toggle('bad', below);
  const dvMeter = $('#m-dv');
  dvMeter.classList.toggle('low', below && !hiddenDraft);
  paintMeter('m-dv', dv, { at: game.W, text: `Your line W = ${game.W}` });
  paintMeter('m-rel', hand.rel, { at: lv.persona.minRel, text: `Needs ${lv.persona.minRel}+` });
  paintMeter('m-rep', repAtStart(game.levelIndex));

  // Play move: needs a card, a legal offer and an offer at or above the line.
  let offerMsg = '';
  let hint = '';
  if (!final && !asking) {
    const o = isOfferLegal(d.offer, prev, hand.turnNumber);
    if (!o.legal) offerMsg = o.reason;
    else if (below) offerMsg = `This offer is below your line (${fmtNum(dv)} is less than ${game.W}).`;
  }
  if (!final && !d.line) hint = 'Pick a card to say something.';
  $('#offer-msg').textContent = offerMsg;
  $('#play-hint').textContent = hint;
  $('#play').disabled = !d.line || offerMsg !== '';

  const counter = hand.opponentCounterPkg;
  $('#accept').disabled = !counter;
  const counterDV = counter ? computeDV(lv, counter) : null;
  $('#their-offer').textContent = counter
    ? `Their offer on the table: ${describePackage(lv, counter)} (worth ${fmtNum(counterDV)} to you${counterDV + eps < game.W ? ', below your line' : ''}).`
    : 'They have no offer on the table yet.';

  // Intel and opponent header.
  $('#intel-body').innerHTML = hand.revealedTerms.length
    ? '<ol>' + hand.revealedTerms.map((t, i) => `<li>Their #${i + 1}: ${esc(t)}</li>`).join('') + '</ol>'
    : '<p class="muted">Nothing yet. Ask a question to learn what they care about most.</p>';
  const last = hand.log[hand.log.length - 1];
  const face = getReactionFace(last ? last.relDelta : 0);
  $('#opp-face').textContent = face.face;
  $('#opp-caption').textContent = face.caption;
  $('#turn-count').textContent = `Turn ${Math.min(hand.turnNumber, lv.persona.maxTurns)} of ${lv.persona.maxTurns}`;
}

function onSliderInput(input) {
  const d = game.draft;
  d.offer[parseInt(input.dataset.term, 10)] = parseInt(input.value, 10);
  updateTableControls();
}
function selectCard(key) {
  const d = game.draft;
  d.line = d.line === key ? null : key;
  updateTableControls();
}

function playMove() {
  const lv = curLevel();
  const prev = game.hand;
  const d = game.draft;
  if (!d.line) return;
  const asking = d.line === 'askQuestion';
  const offer = asking ? (prev.previousOwnOfferPkg ? prev.previousOwnOfferPkg.slice() : null) : d.offer.slice();
  let next;
  try {
    next = playTurn(prev, { offerPkg: offer, line: d.line, tone: d.tone, expression: d.expression });
  } catch (err) {
    $('#play-hint').textContent = err.message;
    return;
  }
  const entry = next.log[next.log.length - 1];
  const face = getReactionFace(entry.relDelta);
  const tags = `<span class="tag">${UI_TEXT.lines[d.line].icon} ${UI_TEXT.lines[d.line].name}</span><span class="tag">${UI_TEXT.tones.find((t) => t.key === d.tone).name}</span><span class="tag">${UI_TEXT.expressions.find((x) => x.key === d.expression).name}</span>`;
  const offerLine = asking && !offer ? 'No offer yet.' : `${asking ? 'Offer stays' : 'Offer'}: ${describePackage(lv, offer)}`;
  addChat('you', `<div>${tags}</div><p>“${esc(lv.playerLines[d.line])}”</p><p class="muted">${esc(offerLine)}</p>`);

  const special = entry.response === 'walkout' ? 'walkedOut'
    : entry.bluffCaught ? 'bluffCaught'
    : entry.response === 'accept' ? 'accepting'
    : next.isFinalOffer ? 'finalOffer' : 'countering';
  const spoken = [
    getOpponentLine({ personaKey: lv.personaKey, relChangeBucket: face.bucket }),
    getOpponentLine({ personaKey: lv.personaKey, special }),
  ];
  let words = '';
  if (entry.response === 'counter') words = `<p class="muted">${next.isFinalOffer ? 'Final offer: ' : 'Their offer: '}${esc(describePackage(lv, entry.counterPkg))}</p>`;
  else if (entry.response === 'accept') words = `<p class="muted">They accept: ${esc(describePackage(lv, next.agreedPkg))}</p>`;
  else words = '<p class="muted">🚪 They leave the table.</p>';
  if (entry.revealedTerm) words += `<p class="muted">${esc(UI_TEXT.hints.intel(entry.revealedTerm, next.revealedTerms.length))}</p>`;
  const tip = getCoachTip({
    personaKey: lv.personaKey, turnNumber: entry.turn, line: d.line, lastLine: prev.lastLine, tone: d.tone,
    expression: d.expression, anchorResult: entry.anchorResult, bluffCaught: entry.bluffCaught,
    skipTimeConcession: entry.skipTimeConcession, asksSoFar: next.asksSoFar, relDelta: entry.relDelta,
    offerPkg: entry.offerPkg, previousOwnOfferPkg: prev.previousOwnOfferPkg, levelConfig: lv,
  });
  const oppHTML = oppMsgHTML(face, spoken, words);
  const coachHTML = `🎓 <strong>Coach:</strong> ${esc(tip)}`;
  addChat('opp', oppHTML);
  addChat('coach', coachHTML);
  game.lastReplyHTML = `<div class="msg opp">${oppHTML}</div><div class="msg coach">${coachHTML}</div>`;

  game.hand = next;
  if (next.ended) { finishLevel(null); return; }
  game.draft = makeDraft(lv, next);
  updateTableControls();
  showRelDelta(entry.relDelta);
  const target = next.isFinalOffer ? $('#accept') : ($('.tcard:not(:disabled)') || $('#accept'));
  if (target) target.focus();
}

// Modal confirmation built on <dialog>; falls back to window.confirm when dialogs are unsupported.
let pendingConfirm = null;
function confirmDialog(message, okLabel, onOk) {
  const dlg = $('#confirm');
  if (!dlg || typeof dlg.showModal !== 'function') { if (window.confirm(message)) onOk(); return; }
  $('#confirm-msg').textContent = message;
  $('#confirm-ok').textContent = okLabel;
  pendingConfirm = onOk;
  dlg.returnValue = '';
  dlg.showModal();
}
function acceptOffer() {
  const hand = game.hand;
  if (!hand.opponentCounterPkg) return;
  const dv = computeDV(curLevel(), hand.opponentCounterPkg);
  if (dv + CONFIG.rules.dvEpsilon < game.W) {
    confirmDialog('This is below your line. Fold to save the deal?', 'Fold and accept', () => finishLevel('foldConfirmed'));
  } else {
    finishLevel('accept');
  }
}
function walkAway() {
  confirmDialog('Walk away from the table?', 'Walk away', () => finishLevel('walk'));
}

// ---- end of level: apply Rep and score once, then show the debrief ----
function finishLevel(action) {
  if (game.result) return;
  const hand = game.hand;
  let res;
  let repStart;
  let rep;
  let score;
  try {
    res = determineEnding(hand, hand.ended ? null : action);
    repStart = repAtStart(game.levelIndex);
    rep = updateReputation(repStart, { ending: res.ending, finalRel: res.rel, bluffsCaughtThisLevel: hand.bluffsCaughtThisLevel });
    score = computeLevelScore(res.ending, res.dv, res.rel, game.W);
  } catch (err) {
    const status = $('#play-hint');
    if (status) status.textContent = err.message;
    return;
  }
  if (!hand.ended) game.lastReplyHTML = '';
  game.result = Object.assign({}, res, { score, repBefore: repStart, repAfter: rep.rep, repChanges: rep.changes });
  game.repDelta[game.levelIndex] = rep.rep - repStart;
  game.levelScores[game.levelIndex] = score;
  game.cleared[game.levelIndex] = game.cleared[game.levelIndex] || res.cleared;
  renderDebrief();
}

// ---- 5. Debrief ----
function debriefStats(hand, r) {
  const count = (line) => hand.log.filter((e) => e.line === line).length;
  return {
    concedes: count('concede'), trades: count('trade'), asks: hand.asksSoFar, bluffsCaught: hand.bluffsCaughtThisLevel,
    holdFirmTurns: count('holdFirm'), cleared: r.cleared, ending: r.ending,
  };
}

function renderDebrief() {
  game.screen = 'debrief';
  const lv = curLevel();
  const hand = game.hand;
  const r = game.result;
  const isFold = r.ending === 'foldCleared' || r.ending === 'foldFailed';
  const needRel = lv.persona.minRel + (isFold ? CONFIG.rules.fold.relBonus : 0);
  const repRows = r.repChanges.length
    ? r.repChanges.map((c) => `<li>${esc(c.reason)}: ${fmtDelta(c.delta)}</li>`).join('')
    : '<li>No change</li>';
  let left = 'none';
  if (r.dv == null) {
    left = UI_TEXT.hints.noDeal(bestAcceptableDV(hand));
  } else {
    const best = bestAcceptableDV(hand);
    if (best != null && best - r.dv > 0) left = fmtNum(best - r.dv) + ' points of deal value';
  }
  const timeline = hand.log.map((e) => `<tr><td>${e.turn}</td><td>${UI_TEXT.lines[e.line].name}</td><td>${UI_TEXT.tones.find((t) => t.key === e.tone).name}</td><td>${UI_TEXT.expressions.find((x) => x.key === e.expression).name}</td><td>${fmtDelta(e.relDelta)}</td></tr>`).join('');
  const isLast = game.levelIndex + 1 >= CONFIG.levels.length;
  const hasNext = r.cleared && !isLast;
  const toFinal = r.cleared && isLast;
  show(`
    <h1 id="screen-heading" tabindex="-1">${suitHTML(lv.suit)} Debrief</h1>
    <section class="panel">
      <h2>${esc(UI_TEXT.endings[r.ending])}</h2>
      <ul>
        <li>Final package: ${r.finalPkg ? esc(describePackage(lv, r.finalPkg)) : 'no deal'}</li>
        <li>Deal value: ${r.dv == null ? '—' : fmtNum(r.dv)} against your line of ${game.W}</li>
        <li>Relationship: ${fmtNum(r.rel)} against ${needRel} needed${isFold ? ' (includes the fold bonus)' : ''}</li>
        <li>Reputation: ${fmtNum(r.repBefore)} → ${fmtNum(r.repAfter)}<ul>${repRows}</ul></li>
        <li>Level score: <strong>${fmtNum(r.score)}</strong></li>
        <li>Points left on the table: ${left}</li>
      </ul>
    </section>
    <section class="panel">
      <h2>Turn by turn</h2>
      <div class="tablewrap" tabindex="0" role="region" aria-label="Turn timeline"><table><thead><tr><th>Turn</th><th>Line</th><th>Tone</th><th>Expression</th><th>Rel change</th></tr></thead><tbody>${timeline || '<tr><td colspan="5">No turns were played.</td></tr>'}</tbody></table></div>
    </section>
    <section class="panel"><h2>For next time</h2><ul class="tips">${getCoachTip({ phase: 'debrief', stats: debriefStats(hand, r) }).map((t) => `<li>${esc(t)}</li>`).join('')}</ul></section>
    ${game.lastReplyHTML ? `<section class="panel"><h2>Last exchange</h2><div class="chat" style="max-height:none">${game.lastReplyHTML}</div></section>` : ''}
    <div class="row">
      <button class="btn" data-act="retry">Retry</button>
      ${hasNext ? '<button class="btn" data-act="next">Next level</button>' : ''}
      ${toFinal ? '<button class="btn" data-act="final">Final score</button>' : ''}
      <button class="btn secondary" data-act="menu">Menu</button>
      ${toFinal ? '' : '<button class="btn secondary" data-act="final">Final score</button>'}
    </div>`, lv.suit);
}

// ---- 6. Final score ----
function renderFinal() {
  game.screen = 'final';
  const anyCleared = game.cleared.some(Boolean);
  const total = computeFinalScore(game.levelScores, currentRep());
  const stored = readHighScore();
  let isNew = false;
  if (anyCleared && (stored == null || total > stored)) { isNew = true; writeHighScore(total); }
  game.highScore = isNew ? total : stored;
  const rows = CONFIG.levels.map((lv, i) => `<tr><th scope="row">${suitHTML(lv.suit)} ${esc(lv.name)}</th><td>${game.cleared[i] ? 'cleared' : 'not cleared'}</td><td>${fmtNum(game.levelScores[i])}</td></tr>`).join('');
  show(`
    <h1 id="screen-heading" tabindex="-1">Final score</h1>
    <section class="panel">
      <table><thead><tr><th>Level</th><th>Result</th><th>Score</th></tr></thead><tbody>${rows}
        <tr><th scope="row">Reputation ${fmtNum(currentRep())} × ${CONFIG.rules.score.repFinal}</th><td></td><td>${fmtNum(CONFIG.rules.score.repFinal * currentRep())}</td></tr>
        <tr><th scope="row">Total</th><td></td><td><strong>${fmtNum(total)}</strong></td></tr></tbody></table>
      <p>High score: <strong>${game.highScore == null ? '—' : game.highScore}</strong>${isNew ? ' 🏆 New high score!' : ''}</p>
      ${anyCleared ? '' : '<p class="muted">Clear a level to record a high score.</p>'}
      <div class="row"><button class="btn" data-act="again">Play again</button><button class="btn secondary" data-act="menu">Menu</button></div>
    </section>`, '♠');
}

// ---- wiring ----
const ACTIONS = {
  level: (b) => { game.levelIndex = parseInt(b.dataset.level, 10); renderBriefing(); },
  final: () => renderFinal(),
  menu: () => renderTitle(),
  begin: () => renderSetLine(),
  'begin-back': () => renderBriefing(),
  lock: () => startHand(),
  card: (b) => selectCard(b.dataset.key),
  tone: (b) => { game.draft.tone = b.dataset.key; updateTableControls(); },
  expr: (b) => { game.draft.expression = b.dataset.key; updateTableControls(); },
  play: () => playMove(),
  accept: () => acceptOffer(),
  walk: () => walkAway(),
  retry: () => renderBriefing(),
  next: () => { game.levelIndex += 1; renderBriefing(); },
  again: () => { Object.assign(game, createGame(game.highScore)); renderTitle(); },
};

function initUI() {
  game.highScore = readHighScore();
  const app = $('#app');
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b);
  });
  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'line-range') {
      $('#line-out').textContent = t.value;
      $('#line-bonus').textContent = `Line bonus if you clear without folding: ${CONFIG.rules.score.line * parseInt(t.value, 10)} points.`;
    } else if (t.dataset && t.dataset.term !== undefined) {
      onSliderInput(t);
    }
  });
  $('#confirm').addEventListener('close', () => {
    const ok = $('#confirm').returnValue === 'ok';
    const fn = pendingConfirm;
    pendingConfirm = null;
    if (ok && fn) fn();
  });
  renderTitle();
}
if (typeof document !== 'undefined') { document.addEventListener('DOMContentLoaded', initUI); }

// ---- end of game logic ----
if (typeof module !== 'undefined') { module.exports = { CONFIG, computeDV, computeOV, enumeratePackages, computeMaxLine, packageDistance, computeAcceptanceThreshold, resolveBluffChance, pickOpponentCounter, classifyOfferChange, isOfferLegal, isLineLegal, applyMoveEffects, createInitialHandState, playTurn, determineEnding, computeLevelScore, updateReputation, computeFinalScore, bestAcceptableDV, runSelfTest, termDirections, getReactionFace, relChangeBucket, repBand, getOpponentLine, getCoachTip }; }
if (typeof window !== 'undefined') { runSelfTest(); }
</script>
